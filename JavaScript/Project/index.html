<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Calculator</h2>
    <div class="input">
        <input class="val" id="num1" placeholder="Enter number1">
        <input class="val" id="num2" placeholder="Enter number2">
    </div>

    <br><br>
    
    <div class="cal">
        <button onclick="calculate('+')">Add(+)</button>
        <button onclick="calculate('-')">Sub(-)</button>
        <button onclick="calculate('*')">Multi(*)</button>
        <button onclick="calculate('/')">Div(/)</button>
    </div>

    <h3 id="result">Result : </h3>

    <script src="script.js"></script>
</body>
</html>
